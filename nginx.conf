####################################################################
# DARKSOUL ASCENT — nginx.conf
# VDS + Cloudflare yapılandırması
# Cloudflare proxied (orange cloud) olduğu varsayılır.
####################################################################

# Cloudflare gerçek IP'leri al (CF proxy arkasında çalışmak için)
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2c0f:f248::/32;
set_real_ip_from 2a06:98c0::/29;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name darksoulascent.com www.darksoulascent.com;

    # Cloudflare HTTP → HTTPS redirect
    # (Eğer CF SSL mode = Full(Strict) ise bu satırı kullan)
    return 301 https://darksoulascent.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name darksoulascent.com www.darksoulascent.com;

    # — SSL (kendi Cloudflare Origin sertifikan veya Let's Encrypt) —
    # Cloudflare > SSL/TLS > Origin Server'dan ücretsiz origin cert al:
    ssl_certificate     /etc/nginx/ssl/darksoulascent.com/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/darksoulascent.com/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # — Site kök dizini —
    root  /var/www/darksoulascent;
    index index.html;

    # — Gzip sıkıştırma —
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # — Güvenlik başlıkları —
    add_header X-Frame-Options       "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"       always;
    add_header Permissions-Policy     "geolocation=(), microphone=()" always;

    # — www → non-www yönlendirme —
    if ($host = www.darksoulascent.com) {
        return 301 https://darksoulascent.com$request_uri;
    }

    # — Ana site —
    location / {
        try_files $uri $uri/ /index.html;
    }

    # — Statik dosya cache (1 yıl) —
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # — HTML dosyaları için cache yok (her zaman taze) —
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # — Legal sayfalar —
    location = /privacy-policy.html    { try_files $uri =404; }
    location = /terms-of-service.html  { try_files $uri =404; }
    location = /license-agreement.html { try_files $uri =404; }
    location = /cookie-policy.html     { try_files $uri =404; }

    # — robots.txt —
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # — Gizli dosyalara erişimi engelle —
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # — Hata sayfaları —
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # — Log —
    access_log /var/log/nginx/darksoulascent.access.log;
    error_log  /var/log/nginx/darksoulascent.error.log warn;
}
